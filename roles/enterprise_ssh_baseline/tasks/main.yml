---
- name: Ensure SSH configuration drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy enterprise SSH baseline
  ansible.builtin.template:
    src: 99-enterprise-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-enterprise-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Validate and reload sshd

